baseURL = 'https://go-approx.github.io/'
locale  = 'en-us'
title   = 'go-approx'
# No theme -- the layout is the go-* family template, imported as the Hugo
# module github.com/go-fleettools/landingkit (partials/styles.html,
# theme-toggle.html, fork-ribbon.html, icons/); layouts/index.html is this
# organisation's own.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-approx: interpolation, splines and polynomials in pure Go (CGO=0), validated against SciPy and NumPy. Cubic, PCHIP and Akima interpolation, B-splines, FITPACK smoothing splines, polynomial fits, roots and orthogonal bases."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
# The status of a library is "released vX.Y.Z" only when the repository has a
# tag; otherwise "in development".
[[params.repos]]
  name   = "interp"
  kind   = "library"
  status = "released v0.1.0"
  href   = "https://github.com/go-approx/interp"
  blurb  = "Interpolation, splines and smoothing: <code>interp1d</code>, cubic splines with every boundary condition, PCHIP, Akima and makima, B-splines of any degree, FITPACK smoothing splines, least-squares splines, regular-grid and tensor-product interpolation."
[[params.repos]]
  name   = "poly"
  kind   = "library"
  status = "released v0.1.0"
  href   = "https://github.com/go-approx/poly"
  blurb  = "Polynomials: evaluation (Horner and compensated), arithmetic, least-squares fitting, roots, and the Chebyshev, Legendre, Hermite, HermiteE and Laguerre bases, with the semantics of <code>numpy.polyfit</code>, <code>numpy.roots</code> and <code>numpy.polynomial</code>."
[[params.repos]]
  name   = "docs"
  kind   = "site"
  status = ""
  href   = "https://go-approx.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra): one section per library, made of its own README, with its verification and performance. <a href=\"https://github.com/go-approx/docs\">Source →</a>"
[[params.repos]]
  name   = "brand"
  kind   = "assets"
  status = ""
  href   = "https://github.com/go-approx/brand"
  blurb  = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the README of the library it names, at v0.1.0.
[[params.checks]]
  name = "SciPy and NumPy as oracles"
  what = "SciPy 1.18.1 and NumPy 2.5.4 are run from Go by a tag-gated harness that writes the fixtures; the ordinary tests read them and need no Python. Where SciPy raises, the Go constructor returns an error and the fixture says so. (interp)"
[[params.checks]]
  name = "Edge cases on purpose"
  what = "1, 2 and 3 points, duplicate and unsorted x, NaN and Inf, nodes clustered over 14 orders of magnitude, offsets of 1e8, spans of 1e-9, values of 1e150 and 1e-290, and n = 1e5 and 1e6. (interp)"
[[params.checks]]
  name = "Polynomials, bit for bit"
  what = "`Polyval`, `Polyder`, `Polyint`, `Polyadd`, `Polysub`, `Deconv` and `PolyFromRoots`: 3434 of 3434 values bit-identical to NumPy; each of the five bases: 10016 of 10016. (poly)"
[[params.checks]]
  name = "Compensated Horner"
  what = "`PolyvalComp`: worst error over the theoretical bound is 0.00095, and it is more accurate than Horner at 677 of 780 points. (poly)"
[[params.checks]]
  name = "Fits judged against the exact residual"
  what = "When our sum of squared residuals and NumPy's differ by more than 1000 eps y², both are judged against the exact residual (normal equations at 256 bits). (poly)"
[[params.checks]]
  name = "Gates"
  what = "`poly` holds 100.0% statement coverage and its CI runs Linux, macOS, Windows, arm64, qemu riscv64, loong64, ppc64le, s390x and arm, 386, and compiles every GOOS/GOARCH. (poly)"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.02:1, bright on the dark background 10.14:1.
  base = "#b45309"
  deep = "#6e3305"
  bright = "#f6ad55"
  shadow = "rgba(180,83,9,.7)"
  glow = "rgba(180,83,9,.6)"
  wash = "rgba(180,83,9,.10)"
  washDeep = "rgba(110,51,5,.06)"
  chipBg = "#fef5eb"
  chipBorder = "#fce6cc"
  chipFg = "#6e3305"
  chipBgDark = "rgba(246,173,85,.14)"
  chipBorderDark = "rgba(246,173,85,.32)"
  chipFgDark = "#fad2a2"
  statsEnd = "#fdebd6"
  bandText = "#fef2e4"
